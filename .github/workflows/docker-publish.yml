name: docker-publish

# Builds this image for linux/amd64 and linux/arm64 on native runners and
# publishes the resulting manifest list to GitHub Packages (ghcr.io).
#
# The build logic lives in the shared reusable workflow, so tagging, caching,
# SBOM/provenance and the platform assertions behave the same here as in every
# other NextGenContributions project:
#   https://github.com/NextGenContributions/docker-multiarch-template
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      # Only rebuild when the image definition changes; docs-only commits skip it.
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'persistent-sync.sh'
      - 'persistent-sync-lib.sh'
      - 's6-overlay/**'
      - '.github/workflows/docker-publish.yml'

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    uses: helloano420/docker-multiarch-template/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      # Image name defaults to ghcr.io/<this repo>, i.e.
      # ghcr.io/nextgencontributions/hermes-docker once this lands on main.
      platforms: linux/amd64,linux/arm64
      # Pull requests build and smoke-test both architectures without publishing.
      push: ${{ github.event_name != 'pull_request' }}
      test-command: |
        set -euo pipefail
        # Every tool the image is supposed to add must exist on every platform.
        for tool in uv uvx gh rclone vim leafwiki blogwatcher-cli pdftotext soffice; do
          docker run --rm --entrypoint bash "$IMAGE" -c "command -v $tool" >/dev/null \
            || { echo "::error::$tool missing from the linux/${EXPECTED_ARCH} image"; exit 1; }
        done
        # uv must link to the toolchain bundled for THIS architecture: the base
        # image ships uv-<ver>-linux-x64 on amd64 and ...-linux-arm64 on arm64.
        case "$EXPECTED_ARCH" in
          amd64) uv_suffix=x64 ;;
          arm64) uv_suffix=arm64 ;;
          *)     uv_suffix="$EXPECTED_ARCH" ;;
        esac
        docker run --rm --entrypoint bash "$IMAGE" -c 'readlink -f /usr/local/bin/uv' \
          | grep -q -- "-linux-${uv_suffix}/uv$" \
          || { echo "::error::uv symlink does not point at the ${uv_suffix} toolchain"; exit 1; }
